<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Compilador C</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="topbar">
        <h1>Mini Compilador C</h1>
        <div class="actions">
            <select id="sample-select" aria-label="Exemplos">
                <option value="" selected disabled>Exemplos</option>
                <option value="valido">Programa válido</option>
                <option value="erros">Programa com erros</option>
                <option value="c_completo">C completo (funções e laços)</option>
                <option value="c_erros">C completo com erros</option>
            </select>
            <label class="button" for="source-file">Abrir .c</label>
            <input id="source-file" type="file" accept=".c" hidden>
            <button id="btn-analyze" class="button primary" type="button" title="Ctrl + Enter">Analisar</button>
        </div>
    </header>

    <main class="workspace">
        <section class="panel">
            <div class="editor">
                <div id="line-numbers" class="line-numbers" aria-hidden="true"></div>
                <textarea id="code-editor" aria-label="Código-fonte C" spellcheck="false" autocomplete="off"
                    autocapitalize="off">int a = 10;
int b = 5;
int resultado = a + b;
return resultado;</textarea>
            </div>
        </section>

        <section class="panel">
            <p id="summary" class="summary">Clique em <strong>Analisar</strong> (ou Ctrl + Enter).</p>

            <nav class="tabs" role="tablist">
                <button class="tab active" role="tab" data-tab="tab-problems">Problemas <span id="problems-count">0</span></button>
                <button class="tab" role="tab" data-tab="tab-tokens">Tokens <span id="tokens-count">0</span></button>
                <button class="tab" role="tab" data-tab="tab-symbols">Símbolos <span id="symbols-count">0</span></button>
                <button class="tab" role="tab" data-tab="tab-ast">Árvore</button>
            </nav>

            <div class="tab-content">
                <div class="page active" id="tab-problems">
                    <table>
                        <thead><tr><th></th><th>Linha</th><th>Coluna</th><th>Descrição</th></tr></thead>
                        <tbody id="problems-body"></tbody>
                    </table>
                </div>
                <div class="page" id="tab-tokens">
                    <table>
                        <thead><tr><th>#</th><th>Tipo</th><th>Lexema</th><th>Linha</th><th>Coluna</th></tr></thead>
                        <tbody id="tokens-body"></tbody>
                    </table>
                </div>
                <div class="page" id="tab-symbols">
                    <table>
                        <thead><tr><th>#</th><th>Lexema</th><th>Categoria</th><th>Tipo</th><th>Linha</th></tr></thead>
                        <tbody id="symbols-body"></tbody>
                    </table>
                </div>
                <div class="page" id="tab-ast">
                    <pre id="ast-output"></pre>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
